[project]
name = "lexcraft"
version = "0.1.0"
description = "Rewrite plain text into region-agnostic legal language with a small local LLM + LoRA adapter."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "prat31" }]
keywords = ["legal", "llm", "lora", "mlx", "style-transfer", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "python-dotenv>=1.0",
    # Apple Silicon gets the MLX backend out of the box.
    "mlx-lm>=0.30,<0.40; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# llama.cpp backend (CPU / CUDA / Vulkan / Metal) for GGUF models.
# For CUDA builds: CMAKE_ARGS="-DGGML_CUDA=on" pip install "lexcraft[llamacpp]"
llamacpp = ["llama-cpp-python>=0.3"]
# LoRA training on NVIDIA GPUs.
cuda = [
    "torch>=2.4",
    "transformers>=4.51",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "accelerate>=1.0",
]
# Extra eval metrics (semantic similarity + NLI) and HTML report.
eval = ["sentence-transformers>=3.0", "plotly>=5.24"]

[project.urls]
Homepage = "https://github.com/prat31/lexcraft"
Issues = "https://github.com/prat31/lexcraft/issues"

[project.scripts]
lexcraft = "lexcraft.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexcraft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
